services:
  db:
    image: postgres:16-alpine
    container_name: mhub-db
    environment:
      POSTGRES_USER: maccount
      POSTGRES_PASSWORD: maccount
      POSTGRES_DB: maccount
    ports:
      - "54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maccount -d maccount"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  pgdata:
